# Two-container Podman pod definition (DEPL-01): the CPU `backend` and the
# GPU-scoped `tts` service run as separate containers sharing one pod
# network namespace, with GPU devices passed ONLY into `tts`.
#
# This is a Kubernetes-style Pod manifest (podman kube play-compatible) kept
# here as the canonical, human-readable record of the pod topology: which
# images make up the pod, the internal port each listens on, the env vars
# wiring the backend to the TTS container, and which container gets which
# GPU device nodes.
#
# IMPORTANT — actual bring-up uses `deploy/run-local.sh`, NOT
# `podman kube play` directly, on this specific rootless/SELinux host. Plain
# Kubernetes Pod YAML has no field for `--group-add keep-groups`, which
# GPU-ENABLEMENT.md's fallback-ladder investigation proved is required on
# this host's Podman + SELinux + AMD-passthrough combination (Task 1/rung 2
# of that log). `podman run --pod` supports `--group-add` directly and
# reliably, so `run-local.sh` builds the pod with `podman pod create` +
# `podman run --pod` instead of `podman kube play` on this manifest. The
# hostPath CharDevice volumes below still document the exact devices/mode
# needed and can be used with `podman kube play` on a host where
# `--group-add keep-groups` is not required (e.g. once
# `container_use_devices` is enabled host-wide — see GPU-ENABLEMENT.md's
# tracked follow-up).
apiVersion: v1
kind: Pod
metadata:
  name: qwen-ebook
spec:
  containers:
    # GPU-scoped TTS container — the ONLY container in this pod with GPU
    # device access. Port 8001 is NOT listed as a hostPort below: it stays
    # internal to the pod network, unreachable from the host (T-03-01).
    - name: tts
      image: localhost/qwen-ebook-tts:dev
      env:
        - name: HSA_OVERRIDE_GFX_VERSION
          value: "11.0.0" # GPU-ENABLEMENT.md rung-2 finding for this local gfx1103 host
        - name: GPU_KEEPALIVE_INTERVAL
          value: "15"
      ports:
        - containerPort: 8001
      volumeMounts:
        - name: kfd
          mountPath: /dev/kfd
        - name: dri
          mountPath: /dev/dri

    # CPU-only backend container — NO GPU devices, reaches the TTS
    # container over the shared pod network at localhost:8001 (T-03-04).
    - name: backend
      image: localhost/qwen-ebook-backend:dev
      env:
        - name: TTS_BACKEND
          value: "http"
        - name: TTS_SERVICE_URL
          value: "http://localhost:8001"
      ports:
        - containerPort: 8000
          hostPort: 8000 # only the backend port is published to the host

  volumes:
    - name: kfd
      hostPath:
        path: /dev/kfd
        type: CharDevice
    - name: dri
      hostPath:
        path: /dev/dri
        type: Directory
