[project]
name = "qwen-ebook-backend"
version = "0.1.0"
description = "Qwen Ebook Narrator — CPU-only backend (upload, chunking, TTS orchestration, audio join)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
    "python-multipart==0.0.32",
    "httpx>=0.28,<1.0",
    "sqlmodel>=0.0.39",
    "ebooklib>=0.20",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the real two-container pod running via `bash deploy/run-local.sh`",
]
